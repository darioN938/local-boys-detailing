<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Joke Generator | Local Boys Detailing</title>
  <style>
    :root { --navy:#071c2a; --blue:#0d2f43; --aqua:#62d5d2; --gold:#f7c95c; --cream:#f8f5f0; --white:#fff; --muted:#d7e5e9; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--white); font-family:Arial,Helvetica,sans-serif; background:radial-gradient(circle at 15% 10%,rgba(98,213,210,.24),transparent 30%),linear-gradient(135deg,var(--navy),var(--blue)); }
    .card { width:min(680px,100%); padding:clamp(28px,7vw,58px); text-align:center; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); border-radius:28px; box-shadow:0 24px 60px rgba(0,0,0,.22); backdrop-filter:blur(12px); }
    .boat { font-size:3rem; margin-bottom:10px; }
    .eyebrow { color:var(--aqua); font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:10px 0 12px; font-size:clamp(2rem,7vw,3.6rem); line-height:1; }
    .intro { margin:0 auto 30px; color:var(--muted); }
    .joke-box { min-height:170px; display:grid; place-items:center; margin:22px 0; padding:26px; color:var(--navy); background:var(--cream); border-radius:20px; font-size:clamp(1.15rem,3vw,1.55rem); font-weight:700; line-height:1.5; }
    .joke-box.loading { color:#637783; font-weight:400; }
    .joke-box.error { color:#9b3d32; font-size:1rem; }
    button { min-height:52px; padding:14px 25px; color:var(--navy); background:linear-gradient(180deg,var(--gold),#f5b63a); border:0; border-radius:999px; cursor:pointer; font:inherit; font-weight:800; transition:transform .2s ease,box-shadow .2s ease; }
    button:hover { transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.2); }
    button:focus-visible { outline:3px solid var(--aqua); outline-offset:4px; }
    button:disabled { cursor:wait; opacity:.7; transform:none; }
    .back { display:inline-block; margin-top:24px; color:var(--muted); font-size:.92rem; }
    .back:hover { color:var(--gold); }
  </style>
</head>
<body>
  <main class="card">
    <div class="boat" aria-hidden="true">⛵</div>
    <div class="eyebrow">Local Boys Detailing</div>
    <h1>Random Joke Generator</h1>
    <p class="intro">Need a laugh while your boat gets cleaned? Tap the button for a fresh joke.</p>
    <section id="joke" class="joke-box" aria-live="polite">Click the button to load a joke.</section>
    <button id="new-joke" type="button">Tell Me a Joke</button>
    <br />
    <a class="back" href="index.html">← Back to Local Boys Detailing</a>
  </main>
  <script>
    const jokeBox = document.getElementById('joke');
    const button = document.getElementById('new-joke');

    async function getJoke() {
      jokeBox.className = 'joke-box loading';
      jokeBox.textContent = 'Finding a good one...';
      button.disabled = true;
      try {
        const response = await fetch('https://v2.jokeapi.dev/joke/Any?safe-mode');
        if (!response.ok) throw new Error('Joke service unavailable');
        const data = await response.json();
        jokeBox.className = 'joke-box';
        jokeBox.textContent = data.type === 'single' ? data.joke : `${data.setup} ${data.delivery}`;
      } catch (error) {
        jokeBox.className = 'joke-box error';
        jokeBox.textContent = 'Sorry, we could not load a joke right now. Please try again.';
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener('click', getJoke);
  </script>
</body>
</html>
